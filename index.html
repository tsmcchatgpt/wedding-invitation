<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盧仲廉 & 史睿涵 婚禮邀請</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-color: #d4af37;
            --text-main: #2c3e50;
            --text-light: #7f8c8d;
            --bg-color: #fdfbf7;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: #f0e9df;
            font-family: 'Noto Serif TC', serif, "Microsoft JhengHei";
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .invitation-card {
            background-color: var(--bg-color);
            width: 100%;
            max-width: 450px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            position: relative;
        }

        .hero-image {
            width: 100%;
            height: 500px;
            object-fit: cover;
            object-position: center 20%;
            display: block;
        }

        .content {
            padding: 40px 30px;
            text-align: center;
        }

        .names {
            font-size: 28px;
            color: var(--text-main);
            letter-spacing: 4px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .heart {
            color: var(--primary-color);
            font-size: 20px;
        }

        .divider {
            width: 40px;
            height: 2px;
            background-color: var(--primary-color);
            margin: 0 auto 25px;
        }

        .message {
            color: var(--text-light);
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 35px;
            letter-spacing: 1px;
        }

        .details {
            text-align: left;
            margin: 0 auto;
            max-width: 300px;
        }

        .detail-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .detail-icon {
            color: var(--primary-color);
            font-size: 18px;
            margin-right: 15px;
            margin-top: 3px;
        }

        .detail-text h3 {
            margin: 0 0 5px 0;
            font-size: 13px;
            color: #bdc3c7;
            letter-spacing: 2px;
            font-weight: normal;
        }

        .detail-text p {
            margin: 0;
            color: var(--text-main);
            font-size: 15px;
            line-height: 1.5;
            letter-spacing: 1px;
        }

        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #bdc3c7;
            font-size: 12px;
            letter-spacing: 3px;
        }

        /* 下載按鈕樣式 (不會被截圖拍進去) */
        .download-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            font-family: 'Noto Serif TC', serif, "Microsoft JhengHei";
            letter-spacing: 1px;
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 100;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.6);
        }

        /* 手機版適應 */
        @media (max-width: 480px) {
            body { padding: 0; }
            .invitation-card { border-radius: 0; min-height: 100vh; }
            .download-btn { bottom: 20px; right: 20px; padding: 12px 20px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="invitation-card" id="capture-area">
        <!-- 這裡已經幫您更新為新的圖片檔名 -->
        <img src="20260313-SAM-2.jpg" alt="盧仲廉與史睿涵的婚紗照" class="hero-image">
        
        <div class="content">
            <div class="names">
                盧仲廉 <span class="heart">♥</span> 史睿涵
            </div>
            <div class="divider"></div>
            
            <div class="message">
                我們決定攜手共度未來的每一天。<br>
                誠摯地邀請您與我們一同分享這份喜悅，<br>
                見證我們的愛情。
            </div>

            <div class="details">
                <div class="detail-item">
                    <div class="detail-icon">📅</div>
                    <div class="detail-text">
                        <h3>DATE</h3>
                        <p>2026 年 12 月 12 日 (星期六)</p>
                    </div>
                </div>

                <div class="detail-item">
                    <div class="detail-icon">⏰</div>
                    <div class="detail-text">
                        <h3>TIME</h3>
                        <p>入席時間：18:00</p>
                    </div>
                </div>

                <div class="detail-item">
                    <div class="detail-icon">📍</div>
                    <div class="detail-text">
                        <h3>VENUE</h3>
                        <p>彭園八德館<br>
                        <span style="font-size: 13px; color: #7f8c8d;">334 桃園市八德區大智里介壽路一段728號3樓</span></p>
                    </div>
                </div>
            </div>

            <div class="footer">
                — SAVE THE DATE —
            </div>
        </div>
    </div>

    <!-- 下載圖片按鈕 -->
    <button class="download-btn" onclick="downloadImage()">下載邀請卡</button>

    <script>

            const btn = document.querySelector('.download-btn');
            btn.style.display = 'none';

            html2canvas(card, {
