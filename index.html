<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盧仲廉 & 史睿涵 婚禮邀請</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-color: #d4af37; /* 典雅金色 */
            --border-color: #2c3e50; /* 深藍色外框 */
            --text-main: #2c3e50;
            --text-light: #7f8c8d;
            --bg-color: #ffffff;
            --page-bg: #f9f7f1; /* 淡淡的米白背景 */
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background-color: var(--page-bg);
            font-family: 'Noto Serif TC', 'PMingLiU', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 橫式卡片主體 */
        .invitation-card {
            background-color: var(--bg-color);
            width: 100%;
            max-width: 900px; /* 加寬以容納左右排版 */
            display: flex;
            border: 2px solid var(--border-color); /* 深藍色質感外框 */
            box-shadow: 0 15px 40px rgba(0,0,0,0.06);
            padding: 20px; /* 外框與內容的留白 */
            box-sizing: border-box;
            position: relative;
        }

        /* 左側照片區 */
        .photo-section {
            flex: 1;
            min-height: 500px;
        }

        .hero-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        /* 右側文字區 */
        .content-section {
            flex: 1;
            padding: 40px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: #fff;
        }

        /* 裝飾圖騰 */
        .decor-top {
            width: 60px;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .names {
            font-size: 28px;
            color: var(--text-main);
            letter-spacing: 6px;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            font-weight: bold;
        }

        .heart {
            color: var(--primary-color);
            font-size: 18px;
        }

        .divider {
            width: 50px;
            height: 1px;
            background-color: var(--primary-color);
            margin: 0 auto 30px;
        }

        .message {
            color: var(--text-light);
            font-size: 14px;
            line-height: 2;
            margin-bottom: 40px;
            letter-spacing: 1.5px;
            text-align: center;
        }

        .details {
            text-align: left;
            width: 100%;
            max-width: 280px;
        }

        .detail-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .detail-icon {
            color: var(--primary-color);
            font-size: 16px;
            margin-right: 15px;
            margin-top: 2px;
        }

        .detail-text h3 {
            margin: 0 0 5px 0;
            font-size: 12px;
            color: #95a5a6;
            letter-spacing: 2px;
            font-weight: normal;
        }

        .detail-text p {
            margin: 0;
            color: var(--text-main);
            font-size: 14px;
            line-height: 1.6;
            letter-spacing: 1px;
        }

        .footer {
            margin-top: 50px;
            color: #bdc3c7;
            font-size: 12px;
            letter-spacing: 4px;
        }

        /* 下載按鈕樣式 */
        .download-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: var(--border-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(44, 62, 80, 0.3);
            font-family: 'Noto Serif TC', serif;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            background-color: var(--primary-color);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }

        /* 手機版自適應：螢幕太小時會自動變回直式排版，避免字太小 */
        @media (max-width: 768px) {
            body { padding: 15px; }
            .invitation-card { flex-direction: column; padding: 10px; }
            .photo-section { min-height: 400px; }
            .content-section { padding: 30px 20px; }
            .download-btn { bottom: 20px; right: 20px; padding: 10px 20px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="invitation-card" id="capture-area">
        <!-- 左側：照片區 -->
        <div class="photo-section">
            <img src="20260313-SAM-2.jpg" alt="盧仲廉與史睿涵的婚紗照" class="hero-image">
        </div>
        
        <!-- 右側：文字資訊區 -->
        <div class="content-section">
            <!-- 裝飾用 SVG 葉片圖騰 -->
            <svg class="decor-top" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 10 C 60 30, 80 40, 90 50 C 80 60, 60 70, 50 90 C 40 70, 20 60, 10 50 C 20 40, 40 30, 50 10 Z" stroke="#d4af37" stroke-width="2" stroke-linejoin="round"/>
                <path d="M50 20 L50 80" stroke="#d4af37" stroke-width="1.5"/>
            </svg>

            <div class="names">
                盧仲廉 <span class="heart">♥</span> 史睿涵
            </div>
            <div class="divider"></div>
            
            <div class="message">
                我們決定攜手共度未來的每一天。<br>
                誠摯地邀請您與我們一同分享這份喜悅，<br>
                見證我們的愛情。
            </div>

            <div class="details">
                <div class="detail-item">
                    <div class="detail-icon">📅</div>
                    <div class="detail-text">
                        <h3>DATE</h3>
                        <p>2026 年 12 月 12 日 (星期六)</p>
                    </div>
                </div>

                <div class="detail-item">
                    <div class="detail-icon">⏰</div>
                    <div class="detail-text">
                        <h3>TIME</h3>
                        <p>入席時間：18:00</p>
                    </div>
                </div>

                <div class="detail-item">
                    <div class="detail-icon">📍</div>
                    <div class="detail-text">
                        <h3>VENUE</h3>
                        <p>彭園八德館<br>
                        <span style="font-size: 13px; color: #7f8c8d;">334 桃園市八德區大智里介壽路一段728號3樓</span></p>
                    </div>
                </div>
            </div>

            <div class="footer">
                — SAVE THE DATE —
            </div>
        </div>
    </div>

    <!-- 下載圖片按鈕 -->
    <button class="download-btn" onclick="downloadImage()">下載卡片</button>

    <script>
        function downloadImage() {
            const btn = document.querySelector('.download-btn');
            btn.style.display = 'none'; // 隱藏按鈕避免被截圖
            
            const card = document.getElementById('capture-area');
            
            html2canvas(card, {
                scale: 2, // 提高畫質
                useCORS: true,
                backgroundColor: "#ffffff" // 確保背景是白色
            }).then(canvas => {
                const image = canvas.toDataURL("image/png");
                const link = document.createElement('a');
                link.download = '盧仲廉與史睿涵-婚禮邀請卡.png';
                link.href = image;
                link.click();
                btn.style.display = 'block'; // 恢復顯示
            }).catch(err => {
                console.error("截圖失敗:", err);
                alert("下載失敗，建議您使用瀏覽器的截圖功能。");
                btn.style.display = 'block';
            });
        }
    </script>
</body>
</html>
