<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盧仲廉 & 史睿涵 婚禮邀請</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-color: #d4af37; /* 典雅金色 */
            --border-color: #2c3e50; /* 深藍色外框 */
            --text-main: #2c3e50;
            --text-light: #7f8c8d;
            --bg-color: #ffffff;
            --page-bg: #f9f7f1; /* 淡淡的米白背景 */
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background-color: var(--page-bg);
            font-family: 'Noto Serif TC', 'PMingLiU', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 橫式卡片主體 */
        .invitation-card {
            background-color: var(--bg-color);
            width: 100%;
            max-width: 900px; /* 加寬以容納左右排版 */
            display: flex;
            border: 2px solid var(--border-color); /* 深藍色質感外框 */
            box-shadow: 0 15px 40px rgba(0,0,0,0.06);
            padding: 20px; /* 外框與內容的留白 */
            box-sizing: border-box;
            position: relative;
        }

        /* 左側照片區 */
        .photo-section {
            flex: 1;
            min-height: 500px;
        }

        .hero-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        /* 右側文字區 */
        .content-section {
            flex: 1;
            padding: 40px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: #fff;
        }

        /* 裝飾圖騰 */
        .decor-top {
            width: 60px;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .names {
            font-size: 28px;
            color: var(--text-main);
            letter-spacing: 6px;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            font-weight: bold;
        }

        .heart {
            color: var(--primary-color);
            font-size: 18px;
        }

        .divider {
            width: 50px;
            height: 1px;
            background-color: var(--primary-color);
            margin: 0 auto 30px;
        }

        .message {
            color: var(--text-light);
            font-size: 14px;
            line-height: 2;
            margin-bottom: 40px;
            letter-spacing: 1.5px;
            text-align: center;
        }

        .details {
            text-align: left;
            width: 100%;
            max-width: 280px;
        }

        .detail-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .detail-icon {
            color: var(--primary-color);
            font-size: 16px;
            margin-right: 15px;
            margin-top: 2px;
        }

        .detail-text h3 {
            margin: 0 0 5px 0;
            font-size: 12px;
            color: #95a5a6;
            letter-spacing: 2px;
            font-weight: normal;
        }

        .detail-text p {
            margin: 0;
            color: var(--text-main);
            font-size: 14px;
            line-height: 1.6;
            letter-spacing: 1px;
        }

        .footer {
            margin-top: 50px;
            color: #bdc3c7;
            font-size: 12px;
            letter-spacing: 4px;
        }

        /* 下載按鈕樣式 */
        .download-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: var(--border-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(44, 62, 80, 0.3);
            font-family: 'Noto Serif TC', serif;
            letter-spacing: 1px;
            transition: all 0.3s ease;
